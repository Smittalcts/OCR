<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oncall Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">KnowGauge</h1>
            <p class="text-sm text-gray-500">Sign in to continue</p>
        </div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div id="errorMsg" class="text-red-500 text-sm hidden bg-red-50 p-3 rounded-lg border border-red-100"></div>
            
            <button type="submit" id="btnLogin" class="w-full bg-gray-900 text-white py-2.5 rounded-lg hover:bg-black transition font-medium">Login</button>
            
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">OR</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <button type="button" id="btnRegister" class="w-full bg-white text-gray-700 border border-gray-300 py-2.5 rounded-lg hover:bg-gray-50 transition font-medium">Create Candidate Account</button>
        </form>
    </div>

    <script>
        document.getElementById('btnLogin').onclick = async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            if(!u || !p) return;

            // Login expects form-data format for OAuth2
            const formData = new URLSearchParams();
            formData.append('username', u);
            formData.append('password', p);

            try {
                const res = await fetch('/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });
                
                if (!res.ok) throw new Error('Invalid credentials');
                
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                
                // --- Redirect Logic Based on Role ---
                if (data.role === 'manager') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                const errorEl = document.getElementById('errorMsg');
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        };

        document.getElementById('btnRegister').onclick = async () => {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            if(!u || !p) {
                alert("Please enter a username and password to create an account.");
                return;
            }

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });

                if(res.ok) {
                    alert("Account created! You can now log in.");
                } else {
                    const err = await res.json();
                    alert(err.detail || "Registration failed.");
                }
            } catch (e) {
                alert("Connection error.");
            }
        };
    </script>
</body>
</html>
